---
# =============================================================================
# GitLab Omnibus configuration
# =============================================================================
#
# Renders the persistent /etc/gitlab/gitlab.rb configuration.
#
# GitLab 19.2+ uses:
#
#   gitlab_rails['nginx'][*]
#
# for Rails-specific bundled NGINX settings. We use those current keys rather
# than the deprecated top-level nginx equivalents.
#
# =============================================================================


- name: Render GitLab Omnibus configuration
  ansible.builtin.template:
    src: gitlab.rb.j2
    dest: "{{ gitlab_config_dir }}/gitlab.rb"
    owner: root
    group: root
    mode: "0640"
  notify:
    - Reconfigure GitLab