---
# =============================================================================
# GitLab Docker Compose configuration
# =============================================================================
#
# Renders the Compose definition used to run the GitLab EE container.
#
# The Compose file is generated on the managed host and is not maintained
# manually.
#
# =============================================================================


- name: Render GitLab Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ gitlab_compose_dir }}/docker-compose.yml"
    owner: "{{ gitlab_deployment_user }}"
    group: "{{ gitlab_deployment_user }}"
    mode: "0640"
  notify:
    - Reconcile GitLab Compose


- name: Validate generated Docker Compose configuration
  ansible.builtin.command:
    cmd: >-
      docker compose
      --project-directory {{ gitlab_compose_dir }}
      config --quiet
  register: gitlab_compose_validation
  changed_when: false
  failed_when: gitlab_compose_validation.rc != 0