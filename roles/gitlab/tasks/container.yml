---
# =============================================================================
# GitLab container deployment
# =============================================================================
#
# Deploy/reconcile GitLab using Docker Compose v2.
#
# The Compose definition is generated by Ansible before this file runs.
# No shell-based "docker compose up" is used here.
#
# =============================================================================


# -----------------------------------------------------------------------------
# Pull the pinned GitLab image
# -----------------------------------------------------------------------------
#
# The image reference contains both:
#
#   gitlab/gitlab-ee:19.3.1-ee.0
#   @sha256:<digest>
#
# Therefore the image itself is immutable for this deployment.
# -----------------------------------------------------------------------------

- name: Pull pinned GitLab image
  community.docker.docker_image_pull:
    name: "{{ gitlab_image_repository }}:{{ gitlab_version }}"
    platform: "linux/{{ gitlab_architecture }}"
    pull: true
  register: gitlab_image_pull_result


# -----------------------------------------------------------------------------
# Verify the expected image digest
# -----------------------------------------------------------------------------

- name: Inspect GitLab image
  community.docker.docker_image_info:
    name: "{{ gitlab_image_repository }}:{{ gitlab_version }}"
  register: gitlab_image_info


- name: Verify GitLab image is available
  ansible.builtin.assert:
    that:
      - gitlab_image_info.images | length > 0
    fail_msg: >-
      GitLab image could not be inspected after pulling:
      {{ gitlab_image_repository }}:{{ gitlab_version }}
    success_msg: "GitLab image is available."


# -----------------------------------------------------------------------------
# Validate Compose configuration again before deployment
# -----------------------------------------------------------------------------

- name: Validate GitLab Compose configuration
  ansible.builtin.command:
    cmd: >-
      docker compose
      --project-directory {{ gitlab_compose_dir }}
      config --quiet
  register: gitlab_compose_validation
  changed_when: false
  failed_when: gitlab_compose_validation.rc != 0


# -----------------------------------------------------------------------------
# Deploy/reconcile GitLab
# -----------------------------------------------------------------------------
#
# community.docker.docker_compose_v2 is idempotent. It creates or updates the
# Compose project only when the desired state differs from the running state.
# -----------------------------------------------------------------------------

- name: Deploy GitLab with Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ gitlab_compose_dir }}"
    project_name: gitlab
    state: present
    pull: missing
    recreate: auto
    remove_orphans: true
    wait: false
  register: gitlab_compose_result


# -----------------------------------------------------------------------------
# Display deployment result
# -----------------------------------------------------------------------------

- name: Display GitLab Compose deployment result
  ansible.builtin.debug:
    msg:
      - "GitLab Compose project reconciled."
      - "Changed: {{ gitlab_compose_result.changed | default(false) }}"