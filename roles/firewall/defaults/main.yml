---
# =============================================================================
# FIREWALL ROLE DEFAULTS
# =============================================================================
#
# Environment-specific values belong in:
#
#   group_vars/gitlab.yml
#
# This file contains reusable defaults for the firewall role.
#
# =============================================================================


# -----------------------------------------------------------------------------
# UFW
# -----------------------------------------------------------------------------

firewall_package: "ufw"
firewall_package_state: "present"

firewall_default_incoming_policy: "deny"
firewall_default_outgoing_policy: "allow"
firewall_default_routed_policy: "deny"

firewall_logging: "low"


# -----------------------------------------------------------------------------
# Host firewall
# -----------------------------------------------------------------------------

firewall_rule_comment_prefix: "GitLab Ansible"


# -----------------------------------------------------------------------------
# UFW IPv6
# -----------------------------------------------------------------------------

# IPv6 is disabled system-wide for this GitLab deployment.
firewall_manage_ipv6: false

# -----------------------------------------------------------------------------
# Docker firewall
# -----------------------------------------------------------------------------

# Docker's iptables integration must remain enabled because GitLab uses
# Docker-published ports.
docker_firewall_backend: "iptables"
docker_iptables_enabled: true
docker_ip6tables_enabled: true

# Enable administrator-managed filtering through Docker's DOCKER-USER chain.
docker_firewall_enabled: true

# Only these TCP ports are intentionally exposed by the GitLab container.
#
# The values come from the central GitLab configuration.
docker_firewall_allowed_tcp_ports:
  - "{{ gitlab_https_port }}"
  - "{{ gitlab_ssh_port }}"

# Optional explicit external interface.
#
# Leave empty to automatically use ansible_default_ipv4.interface.
docker_firewall_external_interface: ""

# Name of our private chain inside DOCKER-USER.
#
# We manage this chain rather than flushing DOCKER-USER itself. This avoids
# interfering with other software that may use Docker's administrator chain.
docker_firewall_chain: "GITLAB-DOCKER-USER"