---
# =============================================================================
# firewall role
# =============================================================================
#
# Responsibilities:
#   - Install UFW
#   - Establish a deny-by-default inbound policy
#   - Preserve administrative SSH access
#   - Allow GitLab HTTPS
#   - Allow GitLab SSH
#   - Enable UFW only after required rules exist
#   - Validate the resulting firewall state
#
# Docker-specific filtering is intentionally NOT implemented here yet.
# Docker-published ports require separate handling because Docker manages its
# own packet-filtering rules.
#
# =============================================================================


# -----------------------------------------------------------------------------
# Validate required firewall variables
# -----------------------------------------------------------------------------

- name: Validate administrative SSH port
  ansible.builtin.assert:
    that:
      - ansible_port is defined
      - ansible_port | int > 0
      - ansible_port | int < 65536
    fail_msg: >-
      A valid administrative SSH port is required before UFW can be enabled.
    success_msg: >-
      Administrative SSH port validated: {{ ansible_port }}.


- name: Validate GitLab HTTPS port
  ansible.builtin.assert:
    that:
      - gitlab_https_port | int > 0
      - gitlab_https_port | int < 65536
    fail_msg: >-
      Invalid GitLab HTTPS port: {{ gitlab_https_port }}.
    success_msg: >-
      GitLab HTTPS port validated: {{ gitlab_https_port }}.


- name: Validate GitLab SSH port
  ansible.builtin.assert:
    that:
      - gitlab_ssh_port | int > 0
      - gitlab_ssh_port | int < 65536
    fail_msg: >-
      Invalid GitLab SSH port: {{ gitlab_ssh_port }}.
    success_msg: >-
      GitLab SSH port validated: {{ gitlab_ssh_port }}.


- name: Validate unique SSH ports
  ansible.builtin.assert:
    that:
      - ansible_port | int != gitlab_ssh_port | int
    fail_msg: >-
      Administrative SSH port ({{ ansible_port }}) and GitLab SSH port
      ({{ gitlab_ssh_port }}) must be different.
    success_msg: >-
      Administrative SSH and GitLab SSH ports are distinct.


# -----------------------------------------------------------------------------
# Install UFW
# -----------------------------------------------------------------------------

- name: Install UFW
  ansible.builtin.apt:
    name: "{{ firewall_package }}"
    state: "{{ firewall_package_state }}"
    update_cache: true
    cache_valid_time: 3600


# -----------------------------------------------------------------------------
# Configure UFW defaults
# -----------------------------------------------------------------------------

- name: Set UFW default incoming policy
  community.general.ufw:
    direction: incoming
    policy: "{{ firewall_default_incoming_policy }}"


- name: Set UFW default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: "{{ firewall_default_outgoing_policy }}"


- name: Set UFW default routed policy
  community.general.ufw:
    direction: routed
    policy: "{{ firewall_default_routed_policy }}"


# -----------------------------------------------------------------------------
# Configure UFW logging
# -----------------------------------------------------------------------------

- name: Configure UFW logging
  community.general.ufw:
    logging: "{{ firewall_logging }}"

# -----------------------------------------------------------------------------
# Allow required inbound TCP ports
# -----------------------------------------------------------------------------
#
# The complete list is maintained centrally in:
#
#   group_vars/gitlab.yml
#
# This keeps the firewall role independent from the specific deployment
# values while ensuring all required ports are configured consistently.
# -----------------------------------------------------------------------------

- name: Allow required inbound TCP ports
  community.general.ufw:
    rule: allow
    direction: in
    proto: tcp
    port: "{{ item }}"
    comment: "{{ firewall_rule_comment_prefix }} - TCP {{ item }}"
  loop: "{{ gitlab_firewall_allowed_tcp_ports }}"

# -----------------------------------------------------------------------------
# IPv6
# -----------------------------------------------------------------------------
#
# UFW handles IPv6 through /etc/default/ufw.
#
# When firewall_manage_ipv6 is false, explicitly configure UFW with IPV6=no.
# This keeps the UFW configuration aligned with the host-level IPv6 policy.
# -----------------------------------------------------------------------------

- name: Configure UFW IPv6 support
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^IPV6='
    line: "IPV6={{ 'yes' if firewall_manage_ipv6 | bool else 'no' }}"
    create: false
    owner: root
    group: root
    mode: "0644"


- name: Verify UFW IPv6 configuration
  ansible.builtin.command:
    cmd: grep -E '^IPV6=' /etc/default/ufw
  register: firewall_ipv6_setting
  changed_when: false


- name: Verify UFW IPv6 policy
  ansible.builtin.assert:
    that:
      - >-
        firewall_ipv6_setting.stdout
        == "IPV6={{ 'yes' if firewall_manage_ipv6 | bool else 'no' }}"
    fail_msg: >-
      UFW IPv6 configuration does not match firewall_manage_ipv6.
      Expected IPV6={{ 'yes' if firewall_manage_ipv6 | bool else 'no' }}.
      Actual: {{ firewall_ipv6_setting.stdout }}
    success_msg: >-
      UFW IPv6 configuration matches the configured policy:
      {{ firewall_ipv6_setting.stdout }}


- name: Display UFW IPv6 configuration
  ansible.builtin.debug:
    msg: "{{ firewall_ipv6_setting.stdout }}"


# -----------------------------------------------------------------------------
# Enable UFW
# -----------------------------------------------------------------------------
#
# Required SSH rules have already been created.
# -----------------------------------------------------------------------------

- name: Enable UFW
  community.general.ufw:
    state: enabled


# -----------------------------------------------------------------------------
# Validate firewall state
# -----------------------------------------------------------------------------

- name: Query UFW status
  ansible.builtin.command:
    cmd: ufw status verbose
  register: firewall_status
  changed_when: false


- name: Display UFW status
  ansible.builtin.debug:
    var: firewall_status.stdout_lines


- name: Verify UFW is active
  ansible.builtin.assert:
    that:
      - "'Status: active' in firewall_status.stdout"
    fail_msg: "UFW is not active after firewall configuration."
    success_msg: "UFW is active."


# -----------------------------------------------------------------------------
# Docker firewall policy
# -----------------------------------------------------------------------------
#
# Docker-published ports require filtering through DOCKER-USER because Docker
# creates its own forwarding/NAT rules.
#
# The firewall policy is implemented as:
#
#   DOCKER-USER
#       |
#       +--> GITLAB-DOCKER-USER
#                |
#                +--> ESTABLISHED,RELATED : ACCEPT
#                +--> GitLab published ports : ACCEPT
#                +--> container-originated traffic : RETURN
#                +--> other external traffic : DROP
#
# The dedicated chain prevents this role from flushing rules belonging to
# other software in DOCKER-USER.
# -----------------------------------------------------------------------------

- name: Determine Docker firewall external interface
  ansible.builtin.set_fact:
    docker_firewall_interface: >-
      {{
        docker_firewall_external_interface
        if docker_firewall_external_interface | length > 0
        else ansible_default_ipv4.interface
      }}
  when: docker_firewall_enabled | bool


- name: Validate Docker firewall external interface
  ansible.builtin.assert:
    that:
      - docker_firewall_interface is defined
      - docker_firewall_interface | length > 0
    fail_msg: >-
      Unable to determine the external network interface for the Docker
      firewall. Set docker_firewall_external_interface explicitly.
    success_msg: >-
      Docker firewall external interface:
      {{ docker_firewall_interface }}
  when: docker_firewall_enabled | bool


- name: Validate Docker firewall ports
  ansible.builtin.assert:
    that:
      - docker_firewall_allowed_tcp_ports is defined
      - docker_firewall_allowed_tcp_ports | length > 0
      - >
        docker_firewall_allowed_tcp_ports
        | map('int')
        | select('gt', 0)
        | list
        | length
        ==
        docker_firewall_allowed_tcp_ports | length
      - >
        docker_firewall_allowed_tcp_ports
        | map('int')
        | select('lt', 65536)
        | list
        | length
        ==
        docker_firewall_allowed_tcp_ports | length
    fail_msg: >-
      Docker firewall contains one or more invalid TCP ports.
    success_msg: >-
      Docker firewall allowed TCP ports:
      {{ docker_firewall_allowed_tcp_ports | join(', ') }}
  when: docker_firewall_enabled | bool


- name: Install Docker firewall policy script
  ansible.builtin.template:
    src: docker-user-firewall.sh.j2
    dest: /usr/local/sbin/gitlab-docker-firewall.sh
    owner: root
    group: root
    mode: "0750"
  notify:
    - Restart GitLab Docker firewall service
  when: docker_firewall_enabled | bool


- name: Install Docker firewall systemd service
  ansible.builtin.template:
    src: docker-user-firewall.service.j2
    dest: /etc/systemd/system/gitlab-docker-firewall.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart GitLab Docker firewall service
  when: docker_firewall_enabled | bool


- name: Reload systemd after Docker firewall service changes
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: docker_firewall_enabled | bool


- name: Enable and start GitLab Docker firewall
  ansible.builtin.systemd_service:
    name: gitlab-docker-firewall.service
    enabled: true
    state: started
  when: docker_firewall_enabled | bool


- name: Verify GitLab Docker firewall chain
  ansible.builtin.command:
    cmd: iptables -nL "{{ docker_firewall_chain }}"
  register: gitlab_docker_firewall_status
  changed_when: false
  when: docker_firewall_enabled | bool


- name: Display GitLab Docker firewall policy
  ansible.builtin.debug:
    var: gitlab_docker_firewall_status.stdout_lines
  when: docker_firewall_enabled | bool