[defaults]

# Project-local inventory and roles.
inventory = ./inventory/hosts.yml
roles_path = ./roles

# Keep downloaded Ansible collections inside the project.
collections_path = ./collections

# Security: require SSH host-key verification.
host_key_checking = True

# Use the discovered Python interpreter on managed hosts.
interpreter_python = auto_silent

# Enable SSH connection reuse.
pipelining = True

# Reasonable SSH/Ansible connection timeout.
timeout = 30

# Keep temporary files in the invoking user's home directory.
local_tmp = ~/.ansible/tmp

# Do not create *.retry files in the project.
retry_files_enabled = False

# Avoid noisy warning output for Python interpreter discovery.
deprecation_warnings = True

# Use a modest level of parallelism.
forks = 10

# Enable privilege escalation at play/task level when explicitly requested.
# We intentionally do not set become=True globally.

[ssh_connection]

# Reuse SSH connections where possible.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

# Safer, more predictable than disabling host-key checking.
host_key_checking = True